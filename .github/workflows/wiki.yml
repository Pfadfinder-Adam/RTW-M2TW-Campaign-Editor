name: wiki

# The GitHub wiki is its own git repository (<repo>.wiki.git). Its pages live in docs/wiki/ here, reviewed
# like the code; this job copies them there on every push to main that changes them. Pages made only in
# the wiki's web editor are kept (nothing is deleted there).
on:
  push:
    branches: [main]
    paths: ["docs/wiki/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy docs/wiki into the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          cp docs/wiki/*.md wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is up to date."
          else
            git commit -m "Wiki from docs/wiki at ${GITHUB_SHA::7}"
            git push
          fi

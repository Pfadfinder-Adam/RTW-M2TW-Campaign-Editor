name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# the token may only read, unless a job asks for more (the release upload asks for contents: write)
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the code check (ruff.toml): names never defined or never used, files left open, likely bugs - before the tests
      - run: pip install ruff==0.15.20 numpy
      - run: ruff check --output-format github
      - run: python -m unittest discover -s tests -v

  # the exe on every push in the public repository (its Actions are free); in the private one, where every minute counts
  # (Windows minutes twice) and a Nuitka build takes half an hour, only when asked (Actions -> build -> Run workflow)
  windows-exe:
    needs: test
    if: github.repository == 'Pfadfinder-Adam/RTW-M2TW-Campaign-Editor' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install nuitka==4.3.1 pillow certifi numpy moderngl zstandard
      # Nuitka's C compiler cache: a build after a small change compiles only what changed
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nuitka-cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('campaign_editor/**/*.py') }}
          restore-keys: nuitka-${{ runner.os }}-
      # the exe = the editor compiled to machine code by Nuitka (no .py / .pyc inside to decompile), with the game
      # manifests (Scan tells game, REX and mod files apart), the pictures, add-ons, themes, CREDITS.md and the module list
      - name: build the exe (Nuitka)
        env:
          NUITKA_CACHE_DIR: ${{ runner.temp }}/nuitka-cache
        run: python .github/build_exe.py
      # nothing of the source travels: the compiled folder the exe is packed from holds no .py / .pyc
      - name: no Python source in the exe
        shell: pwsh
        run: |
          $src = Get-ChildItem -Recurse -Path dist\*.dist -Include *.py,*.pyc,*.pyo
          if ($src) { $src.FullName; exit 1 }
          "exe: {0:N1} MB" -f ((Get-Item dist\RTW-M2TW-Campaign-Editor.exe).Length / 1MB)
      # the built exe checks itself before it is handed out: every module imports, the bundled files are there,
      # a tiny mod loads, gets a new faction and Restore puts every byte back (campaign_editor/selfcheck.py)
      - name: self-check of the exe
        shell: pwsh
        timeout-minutes: 5
        run: |
          $t = Get-Date
          $p = Start-Process -FilePath dist\RTW-M2TW-Campaign-Editor.exe -ArgumentList "selfcheck","selfcheck.txt" -Wait -PassThru
          "self-check took {0:N1} s (start included)" -f ((Get-Date) - $t).TotalSeconds
          if (Test-Path selfcheck.txt) { Get-Content selfcheck.txt } else { "no report: the exe did not start" }
          exit $p.ExitCode
      - uses: actions/upload-artifact@v4
        with:
          name: RTW-M2TW-Campaign-Editor
          path: dist/RTW-M2TW-Campaign-Editor.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RTW-M2TW-Campaign-Editor.exe
          body_path: CHANGELOG.md

  # the Linux program only when asked (Actions -> build -> Run workflow); every release builds it too (release.yml)
  linux:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Nuitka's one-file build on Linux needs patchelf; xvfb gives the self-check a screen
      - run: sudo apt-get update -q && sudo apt-get install -y -q patchelf xvfb
      - run: pip install nuitka==4.3.1 pillow certifi numpy moderngl zstandard
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nuitka-cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('campaign_editor/**/*.py') }}
          restore-keys: nuitka-${{ runner.os }}-
      - name: build the Linux program (Nuitka)
        env:
          NUITKA_CACHE_DIR: ${{ runner.temp }}/nuitka-cache
        run: python .github/build_exe.py
      - name: no Python source in the program
        run: |
          if find dist -path '*.dist/*' \( -name '*.py' -o -name '*.pyc' -o -name '*.pyo' \) | grep .; then exit 1; fi
          ls -l dist/RTW-M2TW-Campaign-Editor
      - name: self-check of the program
        timeout-minutes: 5
        run: |
          xvfb-run -a dist/RTW-M2TW-Campaign-Editor selfcheck selfcheck.txt; code=$?
          cat selfcheck.txt 2>/dev/null || echo "no report: the program did not start"
          exit $code
      # a tar keeps the 'may run' mark a plain download loses
      - run: tar -czf RTW-M2TW-Campaign-Editor-linux.tar.gz -C dist RTW-M2TW-Campaign-Editor
      - uses: actions/upload-artifact@v4
        with:
          name: RTW-M2TW-Campaign-Editor-linux
          path: RTW-M2TW-Campaign-Editor-linux.tar.gz

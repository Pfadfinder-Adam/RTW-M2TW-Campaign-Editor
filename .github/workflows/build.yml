name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# the token may only read, unless a job asks for more (the release upload asks for contents: write)
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  windows-exe:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller pillow certifi
      # the game manifests go inside the exe: Scan tells game, REX and mod files apart
      - run: pyinstaller --onefile --windowed --name RTW-M2TW-Campaign-Editor --collect-submodules campaign_editor --add-data "docs/reference/*.json.gz;reference" --add-data "assets/*.png;assets" --add-data "assets/addons/*;assets/addons" --icon assets/icon.ico campaign_editor.py
      # the built exe checks itself before it is handed out: every module imports, the bundled files are there,
      # a tiny mod loads, gets a new faction and Restore puts every byte back (campaign_editor/selfcheck.py)
      - name: self-check of the exe
        shell: pwsh
        timeout-minutes: 5
        run: |
          $p = Start-Process -FilePath dist\RTW-M2TW-Campaign-Editor.exe -ArgumentList "selfcheck","selfcheck.txt" -Wait -PassThru
          if (Test-Path selfcheck.txt) { Get-Content selfcheck.txt } else { "no report: the exe did not start" }
          exit $p.ExitCode
      - uses: actions/upload-artifact@v4
        with:
          name: RTW-M2TW-Campaign-Editor
          path: dist/RTW-M2TW-Campaign-Editor.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RTW-M2TW-Campaign-Editor.exe
          body_path: CHANGELOG.md

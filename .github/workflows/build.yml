name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  windows-exe:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller pillow
      - run: pyinstaller --onefile --windowed --name RTW-Campaign-Editor rtw_faction_tool.py
      - uses: actions/upload-artifact@v4
        with:
          name: RTW-Campaign-Editor
          path: dist/RTW-Campaign-Editor.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RTW-Campaign-Editor.exe
          body_path: CHANGELOG.md

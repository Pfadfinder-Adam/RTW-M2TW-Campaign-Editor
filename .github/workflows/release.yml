name: release

# Started by hand (Actions -> release -> Run workflow, or the API): tests, builds the
# Windows exe and publishes a GitHub release v<version> with it, the notes = this version's part of
# CHANGELOG.md only (laid out by .github/release_notes.py). The release goes to the PUBLIC repository (PUBLIC_REPO
# below - the page people download from, the address every exe asks for a newer version), whatever repository the
# run is in. Run in the private one, where the code lives: the public release's tag is made on the public
# repository's main, the same tag is pushed here on the commit the exe was built from, and it needs the secret
# PUBLIC_REPO_TOKEN (a token that may write the public repository).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v, like 0.1.0"
        required: true

# the token may only read, unless a job asks for more (the release upload asks for contents: write)
permissions:
  contents: read

env:
  PUBLIC_REPO: Pfadfinder-Adam/RTW-M2TW-Campaign-Editor

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # before the long build: a run in the private repository cannot publish without the public one's token
      - name: the public repository's token is set
        if: github.repository != 'Pfadfinder-Adam/RTW-M2TW-Campaign-Editor'
        shell: bash
        env:
          TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::The secret PUBLIC_REPO_TOKEN is not set in this repository (Settings > Secrets and variables > Actions)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the release's text = only this version's part of CHANGELOG.md: the download link first (GitHub puts Assets
      # at the bottom), its '### In short' lines, the rest in a closed fold (.github/release_notes.py). No such part =
      # no release.
      - name: notes of this release only
        run: python .github/release_notes.py "${{ inputs.version }}" "${{ env.PUBLIC_REPO }}"
      - run: python -m unittest discover -s tests
      - run: pip install nuitka==4.3.1 pillow certifi numpy moderngl zstandard
      # Nuitka's C compiler cache: a build after a small change compiles only what changed
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nuitka-cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('campaign_editor/**/*.py') }}
          restore-keys: nuitka-${{ runner.os }}-
      # the exe = the editor compiled to machine code by Nuitka (no .py / .pyc inside to decompile), with the game
      # manifests (Scan tells game, REX and mod files apart), the pictures, add-ons, themes, CREDITS.md and the module list
      - name: build the exe (Nuitka)
        env:
          NUITKA_CACHE_DIR: ${{ runner.temp }}/nuitka-cache
        run: python .github/build_exe.py
      # nothing of the source travels: the compiled folder the exe is packed from holds no .py / .pyc
      - name: no Python source in the exe
        shell: pwsh
        run: |
          $src = Get-ChildItem -Recurse -Path dist\*.dist -Include *.py,*.pyc,*.pyo
          if ($src) { $src.FullName; exit 1 }
          "exe: {0:N1} MB" -f ((Get-Item dist\RTW-M2TW-Campaign-Editor.exe).Length / 1MB)
      # the built exe checks itself before it is handed out: every module imports, the bundled files are there,
      # a tiny mod loads, gets a new faction and Restore puts every byte back (campaign_editor/selfcheck.py)
      - name: self-check of the exe
        shell: pwsh
        timeout-minutes: 5
        run: |
          $t = Get-Date
          $p = Start-Process -FilePath dist\RTW-M2TW-Campaign-Editor.exe -ArgumentList "selfcheck","selfcheck.txt" -Wait -PassThru
          "self-check took {0:N1} s (start included)" -f ((Get-Date) - $t).TotalSeconds
          if (Test-Path selfcheck.txt) { Get-Content selfcheck.txt } else { "no report: the exe did not start" }
          exit $p.ExitCode
      - uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.PUBLIC_REPO }}
          token: ${{ github.repository == 'Pfadfinder-Adam/RTW-M2TW-Campaign-Editor' && github.token || secrets.PUBLIC_REPO_TOKEN }}
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.repository == 'Pfadfinder-Adam/RTW-M2TW-Campaign-Editor' && github.sha || 'main' }}
          name: RTW & M2TW Campaign Editor ${{ inputs.version }}
          body_path: release_notes.md
          files: dist/RTW-M2TW-Campaign-Editor.exe
      # the private repository keeps the same tag on the commit the exe was built from: its own history says which
      # code each public release is
      - name: the tag in the private repository too
        if: github.repository != 'Pfadfinder-Adam/RTW-M2TW-Campaign-Editor'
        shell: bash
        run: |
          git tag "v${{ inputs.version }}" "${{ github.sha }}"
          git push origin "v${{ inputs.version }}"

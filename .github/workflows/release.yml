name: release

# Started by hand (Actions -> release -> Run workflow, or the API): tests, builds the
# Windows exe and publishes a GitHub release v<version> with it, the notes = this version's part of
# CHANGELOG.md only. The tag is made by GitHub on the commit the run is for.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v, like 0.1.0"
        required: true

# the token may only read, unless a job asks for more (the release upload asks for contents: write)
permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the release's text = only this version's part of CHANGELOG.md (under its "## X.Y.Z" heading, up to the next
      # "## "); the earlier versions stay in CHANGELOG.md. No such part = no release.
      - name: notes of this release only
        shell: python
        env:
          VERSION: ${{ inputs.version }}
        run: |
          import os, re, sys
          version = os.environ["VERSION"].strip().lstrip("v")
          head = re.compile(r"## \[?v?%s\]?(\s|$)" % re.escape(version))
          notes, inside = [], False
          with open("CHANGELOG.md", encoding="utf-8") as fh:
              for line in fh.read().splitlines():
                  if line.startswith("## "):
                      if inside:
                          break
                      inside = bool(head.match(line))
                      continue
                  if inside:
                      notes.append(line)
          text = "\n".join(notes).strip()
          if not text:
              sys.exit("CHANGELOG.md has no '## %s' part with text - write it first" % version)
          with open("release_notes.md", "w", encoding="utf-8") as fh:
              fh.write(text + "\n")
          # the Windows runner's console is cp1252: a character it lacks (a ✕) stopped the release here (0.33.0)
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          print(text)
      - run: python -m unittest discover -s tests
      - run: pip install pyinstaller pillow certifi numpy
      # the game manifests go inside the exe: Scan tells game, REX and mod files apart
      - run: pyinstaller --onefile --windowed --name RTW-M2TW-Campaign-Editor --collect-submodules campaign_editor --add-data "docs/reference/*.json.gz;reference" --add-data "assets/*.png;assets" --add-data "assets/addons/*;assets/addons" --add-data "CREDITS.md;." --icon assets/icon.ico campaign_editor.py
      # the built exe checks itself before it is handed out: every module imports, the bundled files are there,
      # a tiny mod loads, gets a new faction and Restore puts every byte back (campaign_editor/selfcheck.py)
      - name: self-check of the exe
        shell: pwsh
        timeout-minutes: 5
        run: |
          $p = Start-Process -FilePath dist\RTW-M2TW-Campaign-Editor.exe -ArgumentList "selfcheck","selfcheck.txt" -Wait -PassThru
          if (Test-Path selfcheck.txt) { Get-Content selfcheck.txt } else { "no report: the exe did not start" }
          exit $p.ExitCode
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: RTW & M2TW Campaign Editor ${{ inputs.version }}
          body_path: release_notes.md
          files: dist/RTW-M2TW-Campaign-Editor.exe
